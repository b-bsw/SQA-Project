name: Deploy report website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - script/build_report_site.py
      - Deepseek-flash-v4/Result/report.csv
      - Deepseek-flash-v4/Result2/report.csv
      - Gemini-3.8-flash/report.csv
      - 'Feedback-Directed Random Test Generation/report.csv'
      - 'Feedback-Directed Random Test Generation/report_Round2.csv'
      - GeneticAlgorithm/Result_Round1/report.csv
      - GeneticAlgorithm/Result_Round2/report.csv
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build report snapshot and site files
        run: python3 script/build_report_site.py --site-dir _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
